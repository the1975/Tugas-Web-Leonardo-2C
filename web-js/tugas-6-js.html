<!DOCTYPE html>
<html>
<head>
    <title>Operator Pembanding</title>
</head>
<body>
  <h1>Tugas 6 JavaScript Operator Pembanding</h1>
  
    <script type="text/javascript">
        let a = 3;
        document.write('a = '+a+'<br>');
        let b = 2;
        document.write('b = '+b+'<br>');
        let c;
 
        //sama dengan
        c = a == b;
        document.write('a == b = '+c+'<br>');
 
        //lebih besar
        c = a > b;
        document.write('a > b = '+c+'<br>');
 
        //lebih besar sama dengan
        c = a >= b;
        document.write('a >= b = '+c+'<br>');
 
        //kurang dari
        c = a < b;
        document.write('a < b = '+c+'<br>');
 
        //kurang dari sama dengan
        c = a <= b;
        document.write('a <= b = '+c+'<br>');
 
        //tidak sama dengan
        c = a != b;
        document.write('a != b = '+c+'<br>');
 
    </script>
 
</body>
</html>
